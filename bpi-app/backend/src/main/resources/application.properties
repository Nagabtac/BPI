spring.application.name=bpi-backend

# ── MySQL / XAMPP ────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3310/bpidb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP – don't fail startup if DB is unavailable ───────────────────────
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000

# ── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ── Don't run data.sql until we have a DB ────────────────────────────────────
spring.sql.init.mode=never

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── CORS ─────────────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:5173
